<text x="268.00" y="390.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">is a three-line adapter: it builds a MeshSource and calls</text>
<text x="586.00" y="390.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="start">sampleFieldToHermiteOctree()</text>
<text x="46.00" y="412.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">So the mesh path is a strict subset of the field path — one refinement algorithm to reason about, one to test.</text>
<text x="28.00" y="462.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">A leaf entirely inside or outside the surface carries no HermiteLeafData at all (leaf == nullptr, 680 bytes not allocated),</text>
<text x="28.00" y="483.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">which is what makes the octree adaptive in memory before any collapse pass runs.</text>
