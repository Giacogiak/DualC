<text x="60.00" y="444.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Each frontier node roots a DISJOINT subtree — no worker touches</text>
<text x="60.00" y="463.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">another's memory, and no reduction means no floating-point</text>
<text x="60.00" y="482.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">non-associativity.</text>
<rect x="620.00" y="84.00" width="400.00" height="218.00" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4"/>
<text x="632.00" y="104.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#52514e" text-anchor="start">Why the output is bit-identical</text>
<circle cx="648.00" cy="122.00" r="10.00" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="648.00" y="126.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#184f95" text-anchor="middle">1</text>
<text x="666.00" y="126.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">each frontier node roots a DISJOINT subtree</text>
<circle cx="648.00" cy="156.00" r="10.00" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="648.00" y="160.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#184f95" text-anchor="middle">2</text>
<text x="666.00" y="160.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">the frontier is built serially, so its ORDER is fixed</text>
<circle cx="648.00" cy="190.00" r="10.00" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="648.00" y="194.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#184f95" text-anchor="middle">3</text>
<text x="666.00" y="194.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">every node's Hermite data is a pure function of its</text>
<text x="666.00" y="210.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">own bounds and the field — no reduction</text>
<circle cx="648.00" cy="240.00" r="10.00" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="648.00" y="244.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#184f95" text-anchor="middle">4</text>
<text x="666.00" y="244.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">the contourer walks the tree STRUCTURALLY, not in</text>
<text x="666.00" y="260.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">completion order</text>
<text x="640.00" y="288.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="650" fill="#d03b3b" text-anchor="start">…and yet numThreads appears NOWHERE in tests/.</text>
<rect x="620.00" y="316.00" width="400.00" height="106.00" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4"/>
<text x="632.00" y="336.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#52514e" text-anchor="start">parallelFor — 51 lines, no dependency</text>
<text x="640.00" y="356.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">Dynamic scheduling on one atomic counter, because</text>
<text x="640.00" y="373.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">octree subtrees differ wildly in complexity. The calling</text>
<text x="640.00" y="390.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">thread participates. memory_order_relaxed is correct:</text>
<text x="640.00" y="407.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">join() supplies the ordering the writes need.</text>
<rect x="620.00" y="436.00" width="400.00" height="100.00" rx="8" fill="#fbe9e9" stroke="#d03b3b" stroke-width="1.4"/>
<text x="632.00" y="456.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#52514e" text-anchor="start">The hole</text>
<text x="640.00" y="476.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">No exception handling at all. A throw in a worker calls</text>
<text x="640.00" y="493.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">std::terminate; a throw in the main thread's own worker()</text>
<text x="640.00" y="510.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">unwinds past the join loop and terminates too. About ten</text>
<text x="640.00" y="527.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">lines of exception_ptr would fix it.</text>
</svg>
