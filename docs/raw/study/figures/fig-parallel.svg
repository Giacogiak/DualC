<text x="28.00" y="34.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Fork at depth 3: parallel where it is embarrassing, serial where it must be</text>
<text x="28.00" y="55.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">The output is bit-identical regardless of thread count. That is a stronger guarantee than 'thread-safe', and for a manufacturing kernel it is a correctness property.</text>
