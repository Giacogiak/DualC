<text x="47.00" y="262.50" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">REFUSE</text>
<text x="40.00" y="292.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">A sign change on one of the parent's 6</text>
<text x="40.00" y="309.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">internal edges means a surface feature</text>
<text x="40.00" y="326.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">strictly inside it. One vertex cannot</text>
<text x="40.00" y="343.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">represent that.</text>
<text x="296.00" y="96.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="start">hasOuterDoubleCrossing</text>
<rect x="296.00" y="108.00" width="128.00" height="128.00" rx="3" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.8"/>
