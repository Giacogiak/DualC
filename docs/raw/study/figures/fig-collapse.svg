<rect x="808.00" y="250.50" width="60.69" height="20.50" rx="4" fill="#0ca30c" stroke="none" stroke-width="1.5"/>
<text x="815.00" y="262.50" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">PROCEED</text>
<text x="808.00" y="292.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">Merge the QEFs of all 8 children (up to</text>
<text x="808.00" y="309.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">96 samples), solve, and compare the</text>
<text x="808.00" y="326.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">residual against errorThreshold.</text>
<rect x="40.00" y="356.00" width="500.00" height="174.00" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4"/>
<text x="52.00" y="376.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#52514e" text-anchor="start">After the gates</text>
<text x="58.00" y="388.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="700" fill="#184f95" text-anchor="start">merged QEF</text>
<text x="158.00" y="388.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">every crossing edge of all 8 children, re-accumulated</text>
<text x="58.00" y="410.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="700" fill="#184f95" text-anchor="start">acceptance</text>
<text x="158.00" y="410.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">residual &lt;= errorThreshold  (see the caveat below)</text>
<text x="58.00" y="432.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="700" fill="#184f95" text-anchor="start">merged leaf</text>
<text x="158.00" y="432.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">parent corner c = child c's corner c; parent edge e takes</text>
<text x="158.00" y="447.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">whichever child sub-edge has hasCrossing</text>
<text x="58.00" y="469.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="700" fill="#184f95" text-anchor="start">final guard</text>
<text x="158.00" y="469.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">re-run partitionCubeEdges on the merged data and</text>
<text x="158.00" y="484.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">refuse if it yields more than one component</text>
<text x="58.00" y="506.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="700" fill="#184f95" text-anchor="start">install</text>
<text x="158.00" y="506.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">leaf = merged; isLeaf = true; children[c].reset()</text>
<rect x="560.00" y="356.00" width="472.00" height="174.00" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4"/>
<text x="572.00" y="376.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#52514e" text-anchor="start">Two things to volunteer before you are asked</text>
<text x="578.00" y="390.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#d03b3b" text-anchor="start">1. The acceptance test thresholds the NORMAL-EQUATION residual,</text>
<text x="578.00" y="408.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">not the geometric QEF energy — QefSolver::getError() is dead code.</text>
<text x="578.00" y="426.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Correlated in practice, but the threshold is not portable across scales.</text>
<text x="578.00" y="456.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#d03b3b" text-anchor="start">2. simplifyHermiteOctree takes a double, not the params struct, so it</text>
<text x="578.00" y="474.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">hard-codes the pinv tolerance: --qef-reg silently applies to leaf solves</text>
<text x="578.00" y="492.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">but NOT to collapse solves. A real API-shape bug.</text>
<text x="578.00" y="518.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#d03b3b" text-anchor="start">And: neither simplifyHermiteOctree nor simplificationError appears anywhere in tests/.</text>
</svg>
