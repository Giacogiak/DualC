<circle cx="552.00" cy="172.00" r="5.00" fill="#eb6834" stroke="#ffffff" stroke-width="1.6"/>
<rect x="552.00" y="250.50" width="54.02" height="20.50" rx="4" fill="#d03b3b" stroke="none" stroke-width="1.5"/>
<text x="559.00" y="262.50" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">REFUSE</text>
<text x="552.00" y="292.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">Four or more sign changes around a face</text>
<text x="552.00" y="309.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">4-cycle. The merged cell would need more</text>
<text x="552.00" y="326.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">than one vertex on that face.</text>
<text x="808.00" y="96.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="start">all three pass</text>
<rect x="808.00" y="108.00" width="128.00" height="128.00" rx="3" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.8"/>
<line x1="872.00" y1="108.00" x2="872.00" y2="236.00" stroke="#e1e0d9" stroke-width="1.2" stroke-linecap="round"/>
<line x1="808.00" y1="172.00" x2="936.00" y2="172.00" stroke="#e1e0d9" stroke-width="1.2" stroke-linecap="round"/>
