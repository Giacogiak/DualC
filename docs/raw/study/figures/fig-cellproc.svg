<rect x="929.20" y="96.50" width="87.37" height="20.50" rx="4" fill="#898781" stroke="none" stroke-width="1.5"/>
<text x="936.20" y="108.50" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">never emits</text>
<text x="420.00" y="134.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">return if the node is null or a leaf</text>
<text x="420.00" y="152.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">cellProc on each of the 8 children</text>
<text x="420.00" y="170.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">faceProc on the 12 internal faces</text>
<text x="420.00" y="188.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">edgeProc on the 6 internal edges</text>
<rect x="400.00" y="236.00" width="630.00" height="118.00" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4"/>
<rect x="400.00" y="236.00" width="5.00" height="118.00" rx="2" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="420.00" y="262.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">faceProc(a, b, axis)</text>
<rect x="929.20" y="248.50" width="87.37" height="20.50" rx="4" fill="#898781" stroke="none" stroke-width="1.5"/>
<text x="936.20" y="260.50" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">never emits</text>
<text x="420.00" y="286.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">return immediately if BOTH sides are leaves</text>
<text x="420.00" y="304.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">faceProc on the 4 sub-faces</text>
<text x="420.00" y="322.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">edgeProc on the 4 internal edges of the shared face</text>
<rect x="400.00" y="370.00" width="630.00" height="154.00" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4"/>
<rect x="400.00" y="370.00" width="5.00" height="154.00" rx="2" fill="#eb6834" stroke="none" stroke-width="1.5"/>
<text x="420.00" y="396.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">edgeProc(n0..n3, axis)</text>
<rect x="895.20" y="382.50" width="120.72" height="20.50" rx="4" fill="#eb6834" stroke="none" stroke-width="1.5"/>
<text x="902.20" y="394.50" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="start">the ONLY emitter</text>
<text x="420.00" y="420.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">if any node is an interior node: split into</text>
<text x="420.00" y="438.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">  2 sub-edges along the axis and recurse</text>
<text x="420.00" y="456.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">else: pick the FINEST of the four cells, read its</text>
<text x="420.00" y="474.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">  local edge's two signs, and if they differ,</text>
<text x="420.00" y="492.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">  emit the quad</text>
<rect x="400.00" y="540.00" width="630.00" height="118.00" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4"/>
<text x="412.00" y="560.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#52514e" text-anchor="start">Why the recursion is depth-agnostic</text>
<text x="420.00" y="588.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="start">childOrSelf(n, i)</text>
<text x="548.00" y="588.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">— a leaf descends to ITSELF, so a coarse cell can</text>
<text x="420.00" y="606.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">stand in for children it does not have at every deeper level.</text>
<text x="420.00" y="630.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">The finest-cell rule then reads the signs from the deepest of the four —</text>
<text x="420.00" y="648.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">only its local edge IS the absolute minimal edge. See fig-mixed-depth.</text>
<rect x="40.00" y="420.00" width="320.00" height="172.00" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4"/>
<text x="52.00" y="440.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#52514e" text-anchor="start">The six descent tables</text>
<text x="58.00" y="452.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">kCellProcFaceMask</text>
<text x="58.00" y="471.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">kCellProcEdgeMask</text>
<text x="58.00" y="490.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">kFaceProcFaceMask</text>
<text x="58.00" y="509.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">kFaceProcEdgeMask</text>
<text x="58.00" y="528.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">kEdgeProcEdgeMask</text>
<text x="58.00" y="547.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">kProcessEdgeMask</text>
<text x="58.00" y="578.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#d03b3b" text-anchor="start">Hand-derived cube combinatorics — and</text>
<text x="58.00" y="594.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#d03b3b" text-anchor="start">none of the six has a direct unit test.</text>
</svg>
