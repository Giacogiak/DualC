<text x="70.00" y="316.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">child cells</text>
<text x="70.00" y="332.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">recurse: cellProc</text>
<text x="60.00" y="350.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="end">12</text>
<text x="70.00" y="350.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">internal faces</text>
<text x="70.00" y="366.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">faceProc(a, b, axis)</text>
<text x="60.00" y="384.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#eb6834" text-anchor="end">6</text>
<text x="70.00" y="384.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">internal edges</text>
<text x="70.00" y="400.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">edgeProc(4 cells, axis)</text>
<rect x="400.00" y="84.00" width="630.00" height="136.00" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.4"/>
<rect x="400.00" y="84.00" width="5.00" height="136.00" rx="2" fill="#1baf7a" stroke="none" stroke-width="1.5"/>
