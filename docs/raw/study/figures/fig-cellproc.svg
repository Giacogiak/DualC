<rect width="1060" height="700" fill="#fcfcfb"/>
<text x="28.00" y="34.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">The Ju/Schaefer/Warren recursion: enumerate every minimal edge, exactly once</text>
<text x="28.00" y="55.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">No coordinate arithmetic, no neighbour search. Each level enumerates precisely the features that subdividing created.</text>
