<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="632" viewBox="0 0 1060 632" role="img">
<defs></defs>
<rect width="1060" height="632" fill="#fcfcfb"/>
<text x="28.00" y="34.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Manifold dual contouring: one vertex per surface SHEET, not per cell</text>
<text x="28.00" y="55.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">Two separate sheets through one cell would be bridged by a single vertex, producing an edge shared by more than two faces.</text>
