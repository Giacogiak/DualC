<text x="530.00" y="442.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">"The library takes meshes in one global frame. Mesh I/O and</text>
