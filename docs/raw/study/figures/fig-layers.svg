<text x="80.00" y="320.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">miniz (MIT) · stb (PD/MIT) · nlohmann/json (MIT)</text>
<text x="80.00" y="340.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">meshoptimizer (MIT)</text>
