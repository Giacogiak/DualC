<text x="80.00" y="448.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">24 .cpp files, 2 of them vendored (Unlicense)</text>
<text x="80.00" y="468.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">public API in include/dualc/, internals in src/internal/</text>
