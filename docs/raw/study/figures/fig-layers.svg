<text x="80.00" y="576.00" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">a SIBLING checkout, not vendored, not fetched</text>
