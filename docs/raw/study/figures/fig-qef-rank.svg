<rect width="1000" height="430" fill="#fcfcfb"/>
<text x="28.00" y="34.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Rank tells you what the solution actually is</text>
<text x="28.00" y="55.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">The rank of A^T A is the number of independent normal directions among the samples. Below full rank the minimiser is not a point.</text>
<text x="40.00" y="84.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">RANK 1  —  a flat face</text>
<text x="40.00" y="100.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">all normals parallel</text>
<rect x="40.00" y="116.00" width="200.00" height="200.00" rx="3" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.8"/>
