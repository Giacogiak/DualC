<text x="60.00" y="435.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">and the minimiser is exactly where the planes cross.</text>
