<text x="28.00" y="55.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">A hard union is min(a, b). min is differentiable everywhere except the seam, and its derivative IS the active operand's —</text>
<text x="28.00" y="72.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">so returning it is correct subgradient selection, not a hack.</text>
