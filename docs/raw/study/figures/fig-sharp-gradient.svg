<text x="540.00" y="435.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">back to the mass point, and the corner rounds over.</text>
<text x="540.00" y="460.00" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#d03b3b" text-anchor="start">The error is proportional to the cell size, at every depth.</text>
