# The gate as a hosted job (roadmap 20 #51). CI runs `scripts/check.py` and
# nothing else: a red job is a red gate, and no check lives here that the local
# command does not run too. Jobs marked continue-on-error are experiments whose
# result is recorded, never part of the definition of green (decisions D-49).
name: gate

on:
  push:
    branches: ['**']   # every branch: a feature branch with no PR still runs
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -eo pipefail: `check.py | tee` keeps the gate's exit code

env:
  PYTHONUTF8: '1'   # the report holds non-ASCII; a Windows pipe is cp1252 otherwise

jobs:
  # The docs tier with the report-only lists made fatal -- the session-end mode.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # index-staleness and doc-lag read the git log
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Gate (docs tier, strict)
        run: python3 scripts/check.py --docs --strict | tee gate.log
      - name: Annotate the report
        if: always()
        run: python3 .github/workflows/annotate.py gate.log ${{ job.status }}

  # The full default gate: docs tier, configure, build, warnings scan, serial ctest.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-14 was allowed to fail until its first complete run came back
        # green (2026-10-06, roadmap 20 #51); all three are required now.
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Ninja and ccache (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - name: Install Ninja and ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache
      # ccache replays the compiler's stderr on a hit, so the warnings scan
      # still sees every warning; object files themselves are never cached.
      - name: Route the compilers through ccache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Restore ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.os }}-
      # FetchContent sources only. *-src alone is not enough: the git clone
      # step wipes and re-clones a source dir whose *-subbuild stamps are
      # missing, and geometry-central downloads Eigen into its own build tree.
      - name: Restore FetchContent sources
        uses: actions/cache@v5
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
            build/_deps/geometry-central-build/deps/eigen-src
          key: fetchcontent-${{ matrix.os }}-${{ hashFiles('**/CMakeLists.txt') }}
      # -D DUALC_WERROR=ON: a warning in DualC's own code fails the build here,
      # on top of the warnings scan; the local gate keeps the scan alone
      # (roadmap 17 #33, 17/09/02).
      - name: Gate
        run: python scripts/check.py --build-dir build -D DUALC_WERROR=ON | tee gate.log
      - name: Annotate the report
        if: always()
        run: python .github/workflows/annotate.py gate.log ${{ job.status }}
      - name: ccache statistics
        if: always() && runner.os != 'Windows'
        run: ccache -s

  # ASan + UBSan over the build tier (roadmap 17 #33): DualC's own targets are
  # instrumented, every ctest case runs under them, and a finding fails the
  # case (UBSan does not recover). RelWithDebInfo so a report names the line.
  # Born allowed-to-fail (D-49); required since its first two complete runs
  # came back green (2026-10-06, roadmap 17 #33).
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - name: Route the compilers through ccache
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-sanitize-${{ github.run_id }}
          restore-keys: ccache-sanitize-
      # The same FetchContent sources as the Ubuntu build job, under its key.
      - name: Restore FetchContent sources
        uses: actions/cache@v5
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
            build/_deps/geometry-central-build/deps/eigen-src
          key: fetchcontent-ubuntu-24.04-${{ hashFiles('**/CMakeLists.txt') }}
      - name: Gate (build tier, sanitized)
        run: >
          python3 scripts/check.py --build --build-dir build --config RelWithDebInfo
          -D DUALC_SANITIZE=address,undefined | tee gate.log
      - name: Annotate the report
        if: always()
        run: python3 .github/workflows/annotate.py gate.log ${{ job.status }}
      - name: ccache statistics
        if: always()
        run: ccache -s

  # The CPU/GPU parity gate (#31), required since 2026-10-06: the harness under
  # Xvfb + Mesa llvmpipe (GL 4.5 core, R32F colour-renderable). check.py asserts
  # the announced case count, so a short run is red, not a pass.
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install the X11 headers, Xvfb, Mesa and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev xvfb libgl1-mesa-dri
      - name: Configure with the parity harness
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DDUALC_BUILD_TESTS=OFF -DDUALC_BUILD_EXAMPLES=ON
          -DDUALC_BUILD_GLSL_PARITY=ON
      - name: Build the harness
        run: cmake --build build --target dualc_glsl_parity dualc_gen_demo
      # check.py runs the harness from the repo root, which probes data/;
      # a clean clone has no data/, and dualc_gen_demo does not create it.
      - name: Generate the demo meshes into data/
        run: mkdir -p data && build/examples/dualc_gen_demo all --dir data
      - name: Parity
        # --strict: a SKIP (harness not found) must not read as a pass.
        run: xvfb-run -a python3 scripts/check.py --gpu --strict --build-dir build | tee gate.log
      - name: Annotate the report
        if: always()
        run: python3 .github/workflows/annotate.py gate.log ${{ job.status }}
